services:
  - type: web
    name: frontdesk
    runtime: node
    plan: free
    buildCommand: npm run install:all && cd server && npx prisma generate && npx prisma db push && node prisma/seed.js && cd .. && npm run build
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
